name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      # The unit tests are not published, so what is checked here is what a
      # user actually receives: it imports, it runs, every part in the
      # catalog is described, and the generated board packages and the
      # packaging manifest both still agree with the catalog.
      - name: Imports and CLI
        run: |
          python -c "import niusburner; print(niusburner.__version__)"
          python -m niusburner --version
          python -m niusburner boards
          python -m niusburner boards --features

      - name: Catalog is well formed
        run: python ci/check_catalog.py

      - name: Every data file is packaged
        run: python ci/check_packaging.py

      - name: Generated board packages are current
        run: python ci/check_board_packages.py
