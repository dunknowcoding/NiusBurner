[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "niusburner"
version = "0.5.0"
description = "Compile Arduino-shaped sketches and flash them onto parts the Arduino IDE cannot reach"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

[project.scripts]
niusburner = "niusburner.__main__:main"
niusprog    = "niusburner.prog:main"

[tool.setuptools.packages.find]
include = ["niusburner*"]

[tool.setuptools.package-data]
# Every pattern here is family-agnostic on purpose. The previous list named
# mcs51 explicitly, so adding the PIC families left their runtimes and board
# packages out of an installed copy entirely -- an omission invisible from a
# working tree, because an editable install reads the source directory. CI
# checks this list against what is actually on disk.
niusburner = [
    "*.json",
    "adapters/*/*.json",
    "adapters/*/*/*.c",
    "adapters/*/*/*.h",
    "arduino/*/*.txt",
    "arduino/*/cores/niusburner/*",
    "arduino/*/variants/*/*",
    "arduino/*/tools/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
