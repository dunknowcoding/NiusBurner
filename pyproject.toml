[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "niusburner"
version = "0.3.0"
description = "Compile Arduino-shaped sketches and flash them onto parts the Arduino IDE cannot reach"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

[project.scripts]
niusburner = "niusburner.__main__:main"
niusprog    = "niusburner.prog:main"

[tool.setuptools.packages.find]
include = ["niusburner*"]

[tool.setuptools.package-data]
niusburner = [
    "toolchains.json",
    "boards.json",
    "runtime/mcs51/*.c",
    "runtime/mcs51/*.h",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
